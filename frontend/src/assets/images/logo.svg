<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72" role="img" aria-label="PUBG Food Truck">
  <defs>
    <linearGradient id="lgOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9a03f"/>
      <stop offset="1" stop-color="#e2621b"/>
    </linearGradient>
  </defs>

  <!-- Truck mark -->
  <g transform="translate(4 10)">
    <rect x="0" y="6" width="34" height="26" rx="4" fill="url(#lgOrange)"/>
    <path d="M34 12h12l10 10v10H34z" fill="#2a303a"/>
    <rect x="37" y="15" width="12" height="8" rx="2" fill="#cfe6f5"/>
    <rect x="0" y="2" width="34" height="6" rx="3" fill="#ffc107"/>
    <circle cx="11" cy="35" r="6" fill="#1e232b"/>
    <circle cx="11" cy="35" r="2.4" fill="#8a949f"/>
    <circle cx="46" cy="35" r="6" fill="#1e232b"/>
