  </g>

  <!-- Wordmark -->
  <text x="78" y="34" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="24" font-weight="800" letter-spacing="1.5" fill="#1e232b">PUBG</text>
  <text x="78" y="56" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
